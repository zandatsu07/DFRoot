name: Build APK Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DFRoot APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "cmake;3.22.1"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "Built APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Prepare release APK
        run: |
          APK="app/build/outputs/apk/release/dirtyfrag.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::dirtyfrag.apk was not found!"
            echo ""
            echo "Available APK files:"
            find app/build/outputs -type f -name "*.apk" -print
            exit 1
          fi

          cp "$APK" "DFRoot-${GITHUB_REF_NAME}.apk"

          echo "Release APK:"
          ls -lh "DFRoot-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DFRoot ${{ github.ref_name }}"
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            DFRoot-${{ github.ref_name }}.apk
            
