name: Build APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DFRoot APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" \
                     "platforms;android-36" \
                     "build-tools;35.0.0" \
                     "cmake;3.22.1"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare release APK
        run: |
          APK="app/build/outputs/apk/release/dirtyfrag.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::dirtyfrag.apk was not found"
            find app/build/outputs -type f -name "*.apk" -print
            exit 1
          fi
          cp "$APK" "DFRoot-${GITHUB_REF_NAME}.apk"
          ls -lh "DFRoot-${GITHUB_REF_NAME}.apk"

      - name: Upload APK to existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "DFRoot-${GITHUB_REF_NAME}.apk" \
            --clobber
